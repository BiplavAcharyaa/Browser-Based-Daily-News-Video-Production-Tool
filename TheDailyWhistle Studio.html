<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TheDailyWhistle Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--c:#F7F4ED;--c2:#EFECE4;--r:#D9272E;--k:#171717;--g:#77736C;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:14px Inter,system-ui,sans-serif;background:var(--c);color:var(--k)}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid #dcd7ca;flex-wrap:wrap}
header img{width:46px;height:46px;border-radius:50%}header h1{font:900 24px 'Playfair Display',Georgia,serif;margin:0;flex:1}
main{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,460px);gap:24px;padding:24px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #e3dfd3;border-radius:10px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font:900 18px 'Playfair Display',Georgia,serif;color:var(--r)}
input,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid #d6d1c4;border-radius:6px;background:var(--c);margin-bottom:8px;color:var(--k)}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--r);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
button,.up{font:600 13px Inter,sans-serif;border:1px solid var(--k);background:#fff;color:var(--k);border-radius:6px;padding:9px 14px;cursor:pointer;text-align:center}
button.p{background:var(--r);border-color:var(--r);color:#fff}button.p:disabled{opacity:.5}
.th{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.tb{width:92px;position:relative}.tb img{width:92px;height:92px;object-fit:cover;border-radius:6px;display:block}
.ct{display:flex;justify-content:space-between;background:var(--k);border-radius:0 0 6px 6px}.ct b{color:#fff;font-size:12px;padding:4px 5px;cursor:pointer}
.stick{position:sticky;top:12px}#cv{height:min(76vh,860px);aspect-ratio:9/16;max-width:100%;display:block;margin:0 auto 10px;border-radius:8px;background:var(--c);box-shadow:0 8px 30px #0003}
#sc{width:100%;accent-color:var(--r)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{padding:5px 10px;font-size:12px}
.bar{height:8px;background:var(--c2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--r)}
video{width:100%;max-height:70vh;margin-top:10px;border-radius:8px;background:#000}.ep{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--c2)}.ep span{flex:1}.ep button{padding:4px 9px}
small{color:var(--g)}
</style></head><body>
<header><img id="hl" alt="TheDailyWhistle logo"><h1>TheDailyWhistle Studio</h1><button id="bn">New episode</button><button id="bs">Save draft</button></header>
<main><div id="ed"></div><div class="stick"><canvas id="cv" width="1080" height="1920"></canvas>
<div class="row"><button id="pp" style="flex:0 0 80px">Play</button><input id="sc" type="range" min="0" max="1" step="0.01" value="0" style="margin:0"><span id="tm" style="flex:0 0 100px;text-align:right">0:00 / 0:00</span></div>
<div class="chips" id="chips"></div>
<button class="p" id="bg" style="width:100%">Generate video</button><div class="bar" style="margin-top:8px"><i id="pr"></i></div><small id="st">Ready. Rendering runs in real time and needs this tab visible.</small>
<div id="out" hidden><video id="vid" controls playsinline></video><a id="dl"><button class="p" style="width:100%;margin-top:8px">Download video</button></a></div>
<div class="card" style="margin-top:14px"><h3>Previous episodes</h3><div id="pl"><small>None saved yet.</small></div></div></div></main>
